name: CareersPal - Discovery daily

# 01:05 Europe/Bratislava. At most 20 basic searches per day.
# The ledger stops the run at 620 for the month. A phrase is not repeated in the same run.
# Qualifying new employer boards are enabled. Set repository variable DISCOVERY_AUTO_APPROVE to 0 to stop that without deleting history.
on:
  schedule:
    - cron: "5 1 * * *"
      timezone: "Europe/Bratislava"

concurrency:
  group: careerspal-nightly-sourcing
  queue: max

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nextjs/package-lock.json
      - name: Install
        working-directory: nextjs
        run: npm ci
      - name: Run one daily discovery pass
        working-directory: nextjs
        env:
          SUPABASE_URL: ${{ secrets.CAREERSPAL_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.CAREERSPAL_SUPABASE_SERVICE_ROLE_KEY }}
          TAVILY_API_KEY: ${{ secrets.CAREERSPAL_TAVILY_API_KEY }}
          DISCOVERY_AUTO_APPROVE: ${{ vars.DISCOVERY_AUTO_APPROVE }}
        run: npx tsx scripts/sourcing-discover-jobfirst.ts --jobfirst --production-daily
