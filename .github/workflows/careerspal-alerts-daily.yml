name: CareersPal - Daily alerts

on:
  schedule:
    # Catch-up at 08:00 UTC. Premium also goes out at the end of each nightly search.
    # Account and guest alerts go out Tuesday and Friday, after a role is public.
    # Required GitHub Action secrets:
    #   CAREERSPAL_ALERTS_URL = https://www.careerspal.com/api/alerts/daily
    #   CAREERSPAL_ALERTS_CRON_SECRET = same value as Vercel env ALERTS_CRON_SECRET
    - cron: "0 8 * * *"
  workflow_dispatch: {}

jobs:
  send-alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Run daily alerts (cron-safe)
        env:
          ALERTS_URL: ${{ secrets.CAREERSPAL_ALERTS_URL }}
          ALERTS_SECRET: ${{ secrets.CAREERSPAL_ALERTS_CRON_SECRET }}
        run: |
          if [ -z "$ALERTS_URL" ]; then
            echo "Missing secret CAREERSPAL_ALERTS_URL (e.g. https://www.careerspal.com/api/alerts/daily)"
            exit 1
          fi
          if [ -z "$ALERTS_SECRET" ]; then
            echo "Missing secret CAREERSPAL_ALERTS_CRON_SECRET (must match Vercel env ALERTS_CRON_SECRET)"
            exit 1
          fi
          curl -sS -L \
            --connect-timeout 15 \
            --max-time 300 \
            --retry 2 \
            --retry-delay 2 \
            --retry-all-errors \
            --fail \
            -w "\nHTTP_STATUS=%{http_code}\n" \
            -G "$ALERTS_URL" --data-urlencode "secret=$ALERTS_SECRET"

